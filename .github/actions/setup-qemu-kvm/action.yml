name: Set up QEMU/KVM
description: Installs QEMU and the helper tools used by scripts/ci/vm and gives the runner user access to /dev/kvm.

runs:
  using: composite
  steps:
    - name: Install QEMU and helper tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          qemu-system-x86 qemu-utils genisoimage libxml2-utils openssh-client p7zip-full socat unzip

    - name: Allow the runner user to use /dev/kvm
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm
