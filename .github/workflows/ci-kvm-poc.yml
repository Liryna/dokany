name: CI PoC (GHA Build + KVM Driver Verifier)

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_bsod:
        description: 'Trigger a controlled guest BugCheck to verify MEMORY.DMP + kd.exe capture'
        type: boolean
        default: false
      bsod_os:
        description: 'OS image for simulated BSOD self-test'
        type: choice
        options:
          - server2022
          - server2025
          - server2019
          - server2016
        default: server2022

permissions:
  contents: read

concurrency:
  group: ci-kvm-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test-Sign Dokan (Win32/x64/ARM64 + Cygwin/MSYS2 + WiX)
    runs-on: windows-2025-vs2026
    outputs:
      installer_version: ${{ steps.build-dokan.outputs.installer_version }}
    steps:
      - name: Checkout dokany
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache WDK NuGet packages
        id: cache-wdk
        uses: actions/cache@v6
        with:
          path: packages
          key: wdk-nuget-${{ hashFiles('sys/packages.config') }}

      - name: Cache dokan_fstest dependencies (when PR #1365+ is present)
        if: hashFiles('tests/fstest/deps.json') != ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fstest-deps
          key: fstest-deps-${{ hashFiles('tests/fstest/deps.json') }}

      - name: Install Cygwin & MSYS2 (UCRT64 + MINGW32) for dokan_fuse
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cygCache = Join-Path $env:RUNNER_TEMP 'cygwin-pkg-cache'
          $cygSetup = Join-Path $env:RUNNER_TEMP 'setup-x86_64.exe'
          New-Item -ItemType Directory -Force -Path 'C:\cygwin64', $cygCache | Out-Null
          Write-Host "Downloading and installing Cygwin build tools..."
          Invoke-WebRequest -UseBasicParsing -Uri 'https://cygwin.com/setup-x86_64.exe' -OutFile $cygSetup
          $cygProc = Start-Process -FilePath $cygSetup -ArgumentList @(
            '-gqnNdO', '-R', 'C:/cygwin64',
            '-s', 'http://mirrors.kernel.org/sourceware/cygwin/',
            '-l', $cygCache,
            '-P', 'cmake', '-P', 'make', '-P', 'gcc-core', '-P', 'gcc-g++', '-P', 'pkg-config'
          ) -Wait -PassThru
          if ($cygProc.ExitCode -ne 0) {
            throw "Cygwin setup-x86_64.exe failed with exit code $($cygProc.ExitCode)"
          }
          Write-Host "Installing MSYS2 make + MINGW32 + UCRT64 GCC toolchains..."
          & C:\msys64\usr\bin\bash.exe --login -c "pacman -Sy --needed --noconfirm msys2-keyring && pacman -S --needed --noconfirm make mingw-w64-i686-gcc mingw-w64-ucrt-x86_64-gcc"
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS2 pacman install failed with exit code $LASTEXITCODE"
          }

      - name: Build, test-sign, package WiX + release zip, and build test tools
        id: build-dokan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\ci_kvm\build_dokan_gha.ps1 `
            -BuildConfig Release `
            -BuildNumber "${{ github.run_number }}" `
            -OutputDir ci-artifacts `
            -ReleaseDir ci-release `
            -FsTestDepsCacheDir "${{ runner.temp }}\fstest-deps" `
            -RequireFuse

      - name: Upload CI handoff artifacts (DokanSetup + PDB + test tools)
        uses: actions/upload-artifact@v7
        with:
          name: dokan-build-artifacts
          path: ci-artifacts/
          retention-days: 3

      - name: Upload versioned release artifacts (DokanSetup-<ver>.exe + dokan-<ver>.zip)
        uses: actions/upload-artifact@v7
        with:
          name: dokan-release-${{ steps.build-dokan.outputs.installer_version }}
          path: ci-release/
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 90 || 7 }}

  kvm-image:
    name: Prepare KVM Image (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - server2016
          - server2019
          - server2022
          - server2025
    steps:
      - name: Checkout dokany
        uses: actions/checkout@v7

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Restore or save cached Windows Server Core qcow2
        id: cache-img
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kvm-images/${{ matrix.os }}
          key: kvm-win-${{ matrix.os }}-v2-${{ hashFiles('scripts/ci_kvm/bake_image.sh', 'scripts/install_wlk_ifstest.ps1', 'cert/DokanCA.cer') }}

      - name: Bake Windows Server Core qcow2 image (on cache miss)
        if: steps.cache-img.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils genisoimage curl openssh-client zstd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x scripts/ci_kvm/bake_image.sh
          ./scripts/ci_kvm/bake_image.sh "${{ matrix.os }}" "${{ runner.temp }}/kvm-images/${{ matrix.os }}"

  kvm-test:
    name: Kernel + Driver Verifier (${{ matrix.os }} / ${{ matrix.shard }})
    needs: [build, kvm-image]
    if: inputs.simulate_bsod != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - server2016
          - server2019
          - server2022
          - server2025
        shard:
          - shard1
          - shard2
    steps:
      - name: Checkout dokany
        uses: actions/checkout@v7

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - name: Restore cached Windows Server Core qcow2
        id: cache-img
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kvm-images/${{ matrix.os }}
          key: kvm-win-${{ matrix.os }}-v2-${{ hashFiles('scripts/ci_kvm/bake_image.sh', 'scripts/install_wlk_ifstest.ps1', 'cert/DokanCA.cer') }}

      - name: Fail if image cache missing
        if: steps.cache-img.outputs.cache-hit != 'true'
        run: |
          echo "::error::Expected cached KVM image for ${{ matrix.os }} from kvm-image job"
          exit 1

      - name: Download Dokan build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dokan-build-artifacts
          path: ${{ runner.temp }}/dokan-artifacts

      - name: Install QEMU/KVM and run Dokan kernel + Driver Verifier suite
        id: run-kvm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils openssh-client p7zip-full ntfs-3g socat zstd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x scripts/ci_kvm/run_kvm_tests.sh
          ./scripts/ci_kvm/run_kvm_tests.sh \
            "${{ runner.temp }}/kvm-images/${{ matrix.os }}" \
            "${{ runner.temp }}/dokan-artifacts" \
            "${{ runner.temp }}/kvm-results" \
            "${{ matrix.shard }}" \
            "false"

      - name: Upload logs, fstest scorecards, and crash dumps (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kvm-results-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/kvm-results/
          if-no-files-found: ignore
          retention-days: 7

  kvm-bsod-selftest:
    name: BSOD Capture Self-Test (${{ inputs.bsod_os || 'server2022' }})
    needs: [build, kvm-image]
    if: inputs.simulate_bsod == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dokany
        uses: actions/checkout@v7

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift || true

      - name: Restore cached qcow2 for BSOD self-test
        id: cache-img
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kvm-images/${{ inputs.bsod_os || 'server2022' }}
          key: kvm-win-${{ inputs.bsod_os || 'server2022' }}-v2-${{ hashFiles('scripts/ci_kvm/bake_image.sh', 'scripts/install_wlk_ifstest.ps1', 'cert/DokanCA.cer') }}

      - name: Fail if image cache missing
        if: steps.cache-img.outputs.cache-hit != 'true'
        run: |
          echo "::error::Expected cached KVM image for ${{ inputs.bsod_os || 'server2022' }}"
          exit 1

      - name: Download Dokan build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dokan-build-artifacts
          path: ${{ runner.temp }}/dokan-artifacts

      - name: Trigger controlled BugCheck and harvest MEMORY.DMP.7z
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils openssh-client p7zip-full ntfs-3g socat zstd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x scripts/ci_kvm/run_kvm_tests.sh
          ./scripts/ci_kvm/run_kvm_tests.sh \
            "${{ runner.temp }}/kvm-images/${{ inputs.bsod_os || 'server2022' }}" \
            "${{ runner.temp }}/dokan-artifacts" \
            "${{ runner.temp }}/kvm-results" \
            "shard1" \
            "true"

      - name: Upload simulated BSOD crash dump
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kvm-results-bsod-selftest-${{ inputs.bsod_os || 'server2022' }}
          path: ${{ runner.temp }}/kvm-results/
          if-no-files-found: error
          retention-days: 3

  analyze-bsod:
    name: Analyze BSOD MEMORY.DMP (kd.exe !analyze -v)
    needs: [build, kvm-test, kvm-bsod-selftest]
    if: always() && (needs.kvm-test.result == 'failure' || needs.kvm-bsod-selftest.result == 'success')
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout dokany
        uses: actions/checkout@v7

      - name: Download Dokan build artifacts (dokan3.pdb)
        uses: actions/download-artifact@v7
        with:
          name: dokan-build-artifacts
          path: ${{ runner.temp }}/dokan-artifacts

      - name: Download KVM result artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: kvm-results-*
          path: ${{ runner.temp }}/all-kvm-results
          merge-multiple: false

      - name: Run kd.exe !analyze -v on harvested MEMORY.DMP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $analyzeArgs = @{
            ResultsRoot = "${{ runner.temp }}\all-kvm-results"
            SymbolsDir  = "${{ runner.temp }}\dokan-artifacts"
            OutputDir   = "${{ runner.temp }}\bsod-reports"
          }
          if ('${{ inputs.simulate_bsod }}' -eq 'true') {
            $analyzeArgs['RequireDump'] = $true
          }
          .\scripts\ci_kvm\analyze_bsod.ps1 @analyzeArgs

      - name: Upload decoded BSOD analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bsod-analysis-reports
          path: ${{ runner.temp }}/bsod-reports/
          if-no-files-found: ignore
          retention-days: 7
